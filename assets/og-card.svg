<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#07070f"/><stop offset="100%" stop-color="#0d0d1a"/></linearGradient>
    <radialGradient id="n1" cx="15%" cy="20%" r="50%"><stop offset="0%" stop-color="#6c5ce7" stop-opacity="0.22"/><stop offset="100%" stop-color="#07070f" stop-opacity="0"/></radialGradient>
    <radialGradient id="n2" cx="85%" cy="85%" r="45%"><stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.16"/><stop offset="100%" stop-color="#07070f" stop-opacity="0"/></radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#d4ccff"/><stop offset="100%" stop-color="#8b7cf8"/></linearGradient>
    <linearGradient id="path" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#8b7cf8" stop-opacity="0.1"/><stop offset="100%" stop-color="#5eead4" stop-opacity="0.95"/></linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#n1)"/><rect width="1200" height="630" fill="url(#n2)"/>
  <g fill="#d0d8ff">
    <circle cx="92" cy="48" r="1.2" opacity=".6"/><circle cx="340" cy="35" r="1" opacity=".55"/><circle cx="680" cy="22" r="1.1" opacity=".5"/><circle cx="970" cy="40" r="1.3" opacity=".6"/>
    <circle cx="214" cy="112" r=".8" opacity=".45"/><circle cx="530" cy="88" r=".7" opacity=".4"/><circle cx="820" cy="75" r=".9" opacity=".45"/><circle cx="1100" cy="90" r=".8" opacity=".4"/>
    <circle cx="450" cy="170" r="1" opacity=".5"/><circle cx="750" cy="155" r=".8" opacity=".4"/><circle cx="1050" cy="180" r="1.1" opacity=".5"/><circle cx="60" cy="520" r=".9" opacity=".4"/>
  </g>
  <!-- Orbiter planet (top right) and the descent path down to the Lander pad -->
  <circle cx="1010" cy="150" r="64" fill="#1a1740" stroke="#8b7cf8" stroke-opacity=".55" stroke-width="2"/>
  <ellipse cx="1010" cy="150" rx="104" ry="26" fill="none" stroke="#8b7cf8" stroke-opacity=".5" stroke-width="2" transform="rotate(-18 1010 150)"/>
  <path d="M1010 222 C 1010 330, 960 400, 930 470" fill="none" stroke="url(#path)" stroke-width="3" stroke-dasharray="3 9" stroke-linecap="round"/>
  <polygon points="930,472 918,452 942,452" fill="#5eead4"/>
  <!-- Landing pad -->
  <rect x="860" y="492" width="140" height="8" rx="4" fill="#5eead4" opacity=".9"/>
  <rect x="830" y="508" width="200" height="3" rx="1.5" fill="#5eead4" opacity=".3"/>
  <!-- Text -->
  <text x="80" y="262" font-family="Inter, Helvetica, Arial, sans-serif" font-size="128" font-weight="800" letter-spacing="-4" fill="url(#title)">Lander</text>
  <text x="84" y="330" font-family="Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#e0e0f0">Orbiter on any PHP host.</text>
  <text x="84" y="384" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#7878b8">The same admin, the same SQL file (.pod). No Node, no build server.</text>
  <g font-family="'JetBrains Mono', Menlo, monospace" font-size="20" fill="#8b7cf8">
    <rect x="84" y="430" width="132" height="40" rx="20" fill="none" stroke="#8b7cf8" stroke-opacity=".5"/><text x="106" y="457">PHP 8.1+</text>
    <rect x="228" y="430" width="120" height="40" rx="20" fill="none" stroke="#8b7cf8" stroke-opacity=".5"/><text x="250" y="457">SQLite</text>
    <rect x="360" y="430" width="92" height="40" rx="20" fill="none" stroke="#8b7cf8" stroke-opacity=".5"/><text x="382" y="457">MIT</text>
  </g>
  <text x="84" y="570" font-family="'JetBrains Mono', Menlo, monospace" font-size="22" fill="#5eead4">orbiter.sh/lander</text>
</svg>
