# Lokale Testumgebung: PHP 8.3 + Apache, wie auf einem gewöhnlichen Webhost.
services:
  lander:
    image: php:8.3-apache
    ports: ["8088:80"]
    volumes: ["./:/var/www/lander"]
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/lander/public
    command: >
      bash -c "a2enmod rewrite headers >/dev/null &&
      sed -ri 's!/var/www/html!/var/www/lander/public!g' /etc/apache2/sites-available/*.conf /etc/apache2/apache2.conf &&
      sed -ri 's!AllowOverride None!AllowOverride All!g' /etc/apache2/apache2.conf &&
      apache2-foreground"
